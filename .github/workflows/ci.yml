name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned scanners
        run: |
          curl --fail --location --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          curl --fail --location --retry 2 https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 --output /tmp/osv-scanner
          echo 'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  /tmp/osv-scanner' | sha256sum --check
          chmod +x /tmp/osv-scanner

      - name: Secrets
        run: /tmp/gitleaks dir --redact=100 --no-banner --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow .

      - name: Authored source security
        run: |
          mapfile -d '' source_files < <(git ls-files -z -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx')
          docker run --rm -v "$PWD:/src:ro" --workdir /src semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b semgrep scan --config .github/security/semgrep.yml --metrics=off --disable-version-check --disable-nosem --no-git-ignore --jobs=1 --timeout=20 --strict --error -- "${source_files[@]}"

      - name: Locked dependencies
        run: /tmp/osv-scanner scan source --lockfile package-lock.json
